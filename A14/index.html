<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
           margin: 0;
           padding: 0;
           box-sizing: border-box; 
        }
        p{
            background-color: blue;
        }
        h2{
            color: red;
        }
        .dy{
            color: brown;
        }
        #parag1{
            color: yellow;
        }
        .one p{
            padding: 30px;
            color: white;
        }
        .within p{
            color: green;
        }
    </style>
</head>
<body>
    <h2>Heading</h2>
    <p>This is a paragraph</p>
    <p class="dy">Paragrafi dy</p>
    <p class="dy" id="parag1">Paragrafi yellow</p>

    <div class="box one">
        <p class="para1">Paragraf</p>
        <p class="para1">Paragraf</p>
        <div class="within">
            <p>Hello</p>
        </div>
    </div>
    <div class="box">
      <p class="para1">Paragraf</p>
      <p class="para1">Paragraf</p>  
    </div>

</body>
</html>
