<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: bisque;
            border: 4px solid black;
            width: 800px;
            height: 600px;
            margin-left: 120px;
            padding:30px;
        }
        .inside{
            background-color: brown;
            width: 150px;
            height: 150px;
            margin: 10px;
            display: inline-block;
        }
        p{
            display: inline-block;
        }
        .third , .second {
            display: inline-block;
            width: 300px;
            height: 200px;
        }
        span{
            background-color: aqua;
            color:brown;
            font-size: 20px;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box inside"></div>
        <div class="box inside"></div>
        <div class="box inside"></div>
        <div class="box inside"></div>
        <div class="second">
            <p style="font-size: 30px; font-weight: bolder;">This is a parapgraph in another div, with the bold property and a bigger font size </p>
        </div>
        <div class="third">
            <p>This paragraph uses <span>Span Element</span> if we want a specific part to be changed particulary</p>
        </div>
    </div>
</body>
</html>
