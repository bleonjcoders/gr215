<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .subscribe-btn {
            background-color: #e63946;
            color: white;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
        }
        .subscribe-btn img {
            width: 24px;
            height: 24px;
        }
        .r{
            background-color: white;
            width:35px;
            height: 35px;
            border-radius: 50%;
        }
        .r svg{
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="d-flex justify-content-center mt-5">
        <button class="subscribe-btn">
            Subscribe
            <div class="r">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#e63946"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M3 5C3 2.23858 5.23858 0 8 0C10.7614 0 13 2.23858 13 5V8L15 10V12H1V10L3 8V5Z" fill="#e63946"></path> <path d="M7.99999 16C6.69378 16 5.58254 15.1652 5.1707 14H10.8293C10.4175 15.1652 9.30621 16 7.99999 16Z" fill="#e63946"></path> </g></svg>
            </div>
        </button>
    </div>

</body>
</html>
