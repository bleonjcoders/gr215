<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .zemra{
        width: 100px;
        height: 100px;
        background-color: red;
        transform: rotate(-45deg);
        animation: heartbeat 1s infinite;
      }
      .zemra::before, .zemra::after{
        content: "";
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute; /*duhet mu bo absolute*/
        background-color: red;
        /*Duhet me u shtu backgr. col - red*/
        
      }
      .zemra::after{
         top:0;
         left: 50px; /*!*/
      }
      .zemra::before{
        top: -50px;
        left: 0;      /*!*/
      }
      @keyframes heartbeat {
        0%,100%{
          transform: scale(1) rotate(-45deg);
        }
        50%{
          transform: scale(1.2) rotate(-45deg);
        }
      }
    </style>
</head>
<body>
    <div class="zemra"></div>
</body>
</html>
